name: Build Pagaska Drive for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows-app.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Nativefier
        run: npm install --global nativefier

      - name: Build Pagaska Drive Windows app
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "dist-windows"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          nativefier "https://drive.pagaska.my.id" `
            --name "Pagaska Drive" `
            --platform windows `
            --arch x64 `
            --out $out `
            --overwrite

      - name: Package Windows app
        shell: pwsh
        run: |
          $app = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/dist-windows" -Directory | Select-Object -First 1

          if (-not $app) {
            Write-Error "Nativefier did not produce an application directory."
            exit 1
          }

          $zip = Join-Path $env:GITHUB_WORKSPACE "Pagaska-Drive-Windows-x64.zip"
          Compress-Archive -Path "$($app.FullName)/*" -DestinationPath $zip -Force

          Write-Host "Created: $zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Pagaska-Drive-Windows-x64
          path: Pagaska-Drive-Windows-x64.zip
          if-no-files-found: error