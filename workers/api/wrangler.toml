name = "pagaska-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Public environment variable. Secrets (client id/secret, refresh
# token, jwt secret) are set via:
#   wrangler secret put NAME
[vars]
# Public CORS origin. In dev you can leave this "*", in production
# replace with your Vercel domain, e.g. "https://pagaska.vercel.app".
CORS_ORIGIN = "*"

# Resource limits
[limits]
cpu_ms = 50
